<section class="login-screen" aria-labelledby="login-title">
  <aside class="login-visual"><div class="visual-brand"><span>M</span><div><strong>MANAGIX</strong><small>Instituto Superior Yavirac</small></div></div><div class="fashion-shapes" aria-hidden="true"><i></i><i></i><i></i></div><div class="visual-copy"><p>Plataforma académica de</p><h2>Diseño de Modas</h2><small>Recurso visual oficial pendiente de incorporar.</small></div></aside>
  <main class="login-panel"><form class="login-card" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate><div class="login-card__heading"><p class="eyebrow">Acceso seguro</p><h1 id="login-title">Iniciar sesión</h1><p>Ingresa con tu cuenta institucional.</p></div><div class="form-field"><label for="correo">Correo electrónico</label><input id="correo" type="email" autocomplete="email" formControlName="correo" placeholder="nombre@instituto.edu.ec" [attr.aria-invalid]="loginForm.controls.correo.invalid && loginForm.controls.correo.touched"/><small class="field-error" *ngIf="hasError('correo','required')">El correo es obligatorio.</small><small class="field-error" *ngIf="hasError('correo','email')">Ingresa un correo válido.</small></div><div class="form-field"><label for="password">Contraseña</label><div class="password-input"><input id="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" formControlName="password" placeholder="Ingresa tu contraseña" [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"/><button type="button" (click)="showPassword=!showPassword">{{showPassword?'Ocultar':'Mostrar'}}</button></div><small class="field-error" *ngIf="hasError('password','required')">La contraseña es obligatoria.</small></div><p class="login-error" role="alert" *ngIf="errorMessage">{{errorMessage}}</p><button class="submit-button" type="submit" [disabled]="isLoading">{{isLoading?'Verificando credenciales…':'Iniciar sesión'}}</button></form></main>
</section>
