<div class="mgx-layout"><header class="topbar"><button class="menu-toggle" type="button" (click)="menuOpen.set(!menuOpen())" aria-label="Abrir navegación"><svg><use href="assets/icons/ui.svg#menu"></use></svg></button><a class="topbar__brand" routerLink="/dashboard"><span class="topbar__logo">M</span><span class="topbar__identity"><strong>MANAGIX</strong><small>Instituto Superior Yavirac</small></span></a><div class="topbar__spacer"></div><div class="notifications"><button class="topbar__bell" type="button" (click)="alternarNotificaciones()" aria-label="Notificaciones pendientes"><svg><use href="assets/icons/ui.svg#bell"></use></svg><span *ngIf="noLeidas()">{{ noLeidas() }}</span></button><div class="notifications__panel" *ngIf="notificacionesOpen()"><header><strong>Notificaciones</strong><button *ngIf="noLeidas()" type="button" (click)="leerTodas()">Marcar todas</button></header><button *ngFor="let n of notificaciones()" type="button" [class.unread]="!n.leida" (click)="leerNotificacion(n)"><strong>{{ n.titulo }}</strong><span>{{ n.mensaje }}</span></button><p *ngIf="!notificaciones().length">No hay notificaciones.</p></div></div><div class="topbar__avatar">{{ initials() }}</div><div class="topbar__user"><strong>{{ user()?.nombre }} {{ user()?.apellido }}</strong><small>{{ user()?.rol }}</small></div></header><div class="mgx-body"><aside class="sidebar" [class.sidebar--open]="menuOpen()"><nav><a *ngFor="let item of navItems()" [routerLink]="item.route" routerLinkActive="sidebar__link--active" class="sidebar__link" (click)="closeMenu()"><svg class="sidebar__icon"><use [attr.href]="'assets/icons/ui.svg#' + item.icon"></use></svg><span>{{ item.label }}</span></a></nav><button class="sidebar__logout" type="button" (click)="logout()"><svg class="sidebar__icon"><use href="assets/icons/ui.svg#logout"></use></svg> Cerrar sesión</button></aside><button *ngIf="menuOpen()" class="sidebar-backdrop" type="button" (click)="closeMenu()"></button><main class="mgx-content"><router-outlet></router-outlet></main></div></div>
